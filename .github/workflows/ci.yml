name: CI - Test & Lint

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [frontend, backend, integration]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      if: matrix.test-type == 'frontend' || matrix.test-type == 'integration'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'frontend/app/package-lock.json'

    - name: Setup Python
      if: matrix.test-type == 'backend' || matrix.test-type == 'integration'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # Frontend tests
    - name: Install frontend dependencies
      if: matrix.test-type == 'frontend'
      run: |
        cd frontend/app
        npm ci

    - name: Lint frontend code
      if: matrix.test-type == 'frontend'
      run: |
        cd frontend/app
        npm run lint

    - name: Type check frontend
      if: matrix.test-type == 'frontend'
      run: |
        cd frontend/app
        npm run type-check

    - name: Test frontend build
      if: matrix.test-type == 'frontend'
      run: |
        cd frontend/app
        npm run build

    # Backend tests
    - name: Install backend dependencies
      if: matrix.test-type == 'backend'
      run: |
        pip install -r requirements.txt
        pip install pytest flake8 black

    - name: Lint backend code
      if: matrix.test-type == 'backend'
      run: |
        flake8 backend_app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check backend_app/

    - name: Run backend unit tests
      if: matrix.test-type == 'backend'
      run: |
        cd local_dev/tests
        python -m pytest test_simple.py test_portfolio.py -v

    # Integration tests
    - name: Setup integration test environment
      if: matrix.test-type == 'integration'
      run: |
        pip install -r requirements.txt
        cd frontend/app && npm ci

    - name: Start local backend server
      if: matrix.test-type == 'integration'
      run: |
        cd local_dev/backend
        python local_server.py &
        sleep 10  # Wait for server to start
      
    - name: Run integration tests
      if: matrix.test-type == 'integration'
      run: |
        # Test health endpoint
        curl -f http://localhost:5000/health
        
        # Test mock portfolio endpoint
        curl -f -X POST http://localhost:5000/robinhood/mock \
          -H "Content-Type: application/json" \
          -d '{"period": "1y"}'

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0

    - name: Terraform Format Check
      run: |
        cd infra/environments/staging
        terraform fmt -check

    - name: Terraform Init
      run: |
        cd infra/environments/staging
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd infra/environments/staging
        terraform validate

    - name: Run tfsec security scanner
      uses: aquasecurity/tfsec-action@v1.0.0
      with:
        working_directory: infra
