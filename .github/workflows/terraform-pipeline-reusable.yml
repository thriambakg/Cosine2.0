# Reusable Terraform CI/CD Workflow
# .github/workflows/terraform-pipeline-reusable.yml

name: Reusable Terraform Pipeline

on:
  workflow_call:
    inputs:
      terraform_directory:
        description: 'Directory containing Terraform files (relative to repo root)'
        required: false
        default: 'terraform'
        type: string
      infrastructure_type:
        description: 'Type of infrastructure (base-infra or application)'
        required: true
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      destroy:
        description: 'Whether to destroy infrastructure'
        required: false
        default: false
        type: boolean
      force_apply:
        description: 'Force terraform apply even if no changes detected'
        required: false
        default: false
        type: boolean
      base_infra_dependency:
        description: 'Whether this requires base infrastructure to be deployed first'
        required: false
        default: false
        type: boolean
    
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  TF_VERSION: '1.4.0'
  AWS_REGION: 'us-east-1'
  TFLINT_VERSION: '0.46.1'
  TFSEC_VERSION: '1.28.1'

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ inputs.terraform_directory }}
    
    outputs:
      tf-plan-exists: ${{ steps.plan.outputs.tf-plan-exists }}
      plan-summary: ${{ steps.plan.outputs.plan-summary }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      
      - name: Check Base Infrastructure Dependencies
        if: inputs.base_infra_dependency == true
        run: |
          echo "🔍 Checking base infrastructure dependencies..."
          
          BASE_INFRA_BUCKET="cosine-terraform-state-bucket"
          BASE_INFRA_KEY="base-infrastructure/${{ inputs.environment }}/terraform.tfstate"
          
          if aws s3api head-object --bucket "$BASE_INFRA_BUCKET" --key "$BASE_INFRA_KEY" 2>/dev/null; then
            echo "✅ Base infrastructure state found for ${{ inputs.environment }}"
          else
            echo "❌ Base infrastructure not deployed for ${{ inputs.environment }}"
            echo "Please deploy base infrastructure first:"
            echo "  Repository: Cosine-Base-Infra"
            echo "  Environment: ${{ inputs.environment }}"
            exit 1
          fi
      
      - name: Bootstrap Backend Infrastructure (if needed)
        run: |
          echo "🚀 Checking if backend infrastructure exists..."
          
          if aws s3api head-bucket --bucket cosine-terraform-state-bucket 2>/dev/null; then
            echo "✅ Backend infrastructure already exists"
          else
            if [ -d "bootstrap" ]; then
              echo "📦 Creating backend infrastructure..."
              cd bootstrap
              terraform init
              terraform plan
              terraform apply -auto-approve
              cd ..
              echo "✅ Backend infrastructure created successfully"
            else
              echo "❌ Backend infrastructure does not exist and no bootstrap directory found"
              echo "Please ensure backend infrastructure is deployed"
              exit 1
            fi
          fi
      
      - name: Terraform Init
        run: |
          # Initialize with environment-specific backend config
          if [ -f "backend-configs/${{ inputs.environment }}.tfbackend" ]; then
            echo "🔧 Using backend config file: backend-configs/${{ inputs.environment }}.tfbackend"
            terraform init \
              -backend-config="backend-configs/${{ inputs.environment }}.tfbackend" \
              -upgrade
          else
            # Fallback to dynamic backend configuration
            echo "🔧 Using dynamic backend configuration"
            terraform init \
              -backend-config="key=${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" \
              -upgrade
          fi
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Install Security Tools
        run: |
          # Install TFLint
          curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
          unzip tflint.zip -d /usr/local/bin/
          tflint --version
          
          # Install tfsec
          curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
          chmod +x tfsec
          mv tfsec /usr/local/bin/
          tfsec --version
      
      - name: TFLint
        run: |
          tflint --init
          tflint
      
      - name: tfsec Security Scan
        run: |
          tfsec . --format=json --out=tfsec-results.json || true
          tfsec . --format=sarif --out=tfsec-results.sarif || true
          tfsec .
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ inputs.terraform_directory }}/
          framework: terraform
          soft_fail: true
          output_format: sarif
          output_file_path: reports/checkov-results.sarif
      
      - name: Upload Security Scan Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.terraform_directory }}/tfsec-results.sarif
        continue-on-error: true
      
      - name: Upload Checkov Results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov-results.sarif
        continue-on-error: true
      
      - name: Validate Remote State Access
        run: |
          echo "🔍 Validating remote state access..."
          
          # Check if we can access the remote state
          terraform state list > /dev/null 2>&1 || echo "ℹ️ State is empty or this is first deployment"
          
          # Log current state info for debugging
          STATE_RESOURCES=$(terraform state list | wc -l)
          echo "📊 Current state contains $STATE_RESOURCES resources"
          
          if [ $STATE_RESOURCES -gt 0 ]; then
            echo "✅ Remote state accessible with existing resources"
            terraform state list | head -10
          else
            echo "ℹ️ Empty state - proceeding with fresh deployment"
          fi
      
      - name: Terraform Plan
        id: plan
        run: |
          echo "🔍 Planning infrastructure changes..."
          
          # Debug: Show current state and environment
          echo "🔍 DEBUG: Current working directory: $(pwd)"
          echo "🔍 DEBUG: Environment: ${{ inputs.environment }}"
          echo "🔍 DEBUG: Files in current directory:"
          ls -la
          echo "🔍 DEBUG: Terraform state list (first 10 resources):"
          terraform state list | head -10 || echo "No state found"
          
          # Determine which variable files to use
          PLAN_ARGS="-var=environment=${{ inputs.environment }}"
          
          if [ -f "terraform.auto.tfvars" ]; then
            echo "✅ Using terraform.auto.tfvars for variables"
            echo "🔍 DEBUG: Content of terraform.auto.tfvars:"
            cat terraform.auto.tfvars
          elif [ -f "environments/${{ inputs.environment }}.tfvars" ]; then
            echo "✅ Using environment-specific tfvars file"
            PLAN_ARGS="$PLAN_ARGS -var-file=environments/${{ inputs.environment }}.tfvars"
            echo "🔍 DEBUG: Content of environments/${{ inputs.environment }}.tfvars:"
            cat "environments/${{ inputs.environment }}.tfvars"
          else
            echo "⚠️ No variable files found, using defaults"
          fi
          
          # Execute plan (using simple logic like base infra)
          echo "🚀 Executing terraform plan with args: $PLAN_ARGS"
          terraform plan $PLAN_ARGS -out="${{ inputs.environment }}.tfplan" -detailed-exitcode
          
          # Check if plan file exists and has changes (matching base infra logic)
          if [ -f "${{ inputs.environment }}.tfplan" ]; then
            echo "tf-plan-exists=true" >> $GITHUB_OUTPUT
            echo "🔍 DEBUG: Setting tf-plan-exists=true (plan file exists)"
            
            # Generate plan summary
            PLAN_SUMMARY=$(terraform show -no-color ${{ inputs.environment }}.tfplan | head -50)
            echo "plan-summary<<EOF" >> $GITHUB_OUTPUT
            echo "$PLAN_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "tf-plan-exists=false" >> $GITHUB_OUTPUT
            echo "🔍 DEBUG: Setting tf-plan-exists=false (no plan file)"
          fi
      
      - name: Upload Terraform Plan
        if: steps.plan.outputs.tf-plan-exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ inputs.infrastructure_type }}-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/${{ inputs.environment }}.tfplan
          retention-days: 7

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: needs.terraform-plan.outputs.tf-plan-exists == 'true' || inputs.force_apply == true
    
    environment: 
      name: ${{ inputs.environment }}
      
    defaults:
      run:
        working-directory: ${{ inputs.terraform_directory }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-${{ inputs.infrastructure_type }}-${{ inputs.environment }}
          path: ${{ inputs.terraform_directory }}/
      
      - name: Debug Apply Job
        run: |
          echo "🔍 DEBUG APPLY JOB: Starting terraform apply"
          echo "🔍 DEBUG: tf-plan-exists = '${{ needs.terraform-plan.outputs.tf-plan-exists }}'"
          echo "🔍 DEBUG: force_apply = '${{ inputs.force_apply }}'"
          echo "🔍 DEBUG: Condition result: ${{ needs.terraform-plan.outputs.tf-plan-exists == 'true' || inputs.force_apply == true }}"
          echo "🔍 DEBUG: Downloaded files:"
          ls -la
          echo "🔍 DEBUG: Plan files:"
          ls -la *.tfplan || echo "No plan files found"
      
      - name: Terraform Init
        run: |
          # Initialize with same backend config as plan step
          if [ -f "backend-configs/${{ inputs.environment }}.tfbackend" ]; then
            terraform init \
              -backend-config="backend-configs/${{ inputs.environment }}.tfbackend" \
              -upgrade
          else
            terraform init \
              -backend-config="key=${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" \
              -upgrade
          fi
      
      - name: Handle Resource Conflicts
        if: inputs.destroy != true
        run: |
          echo "🔍 Pre-flight check for potential resource conflicts..."
          
          # This step provides guidance for manual intervention if needed
          echo "ℹ️ If the apply step fails due to existing resources, consider:"
          echo "   1. Import existing resources: terraform import <resource_type.name> <resource_id>"
          echo "   2. Use terraform import blocks in your configuration"
          echo "   3. Check resource naming conflicts"
          echo "   4. Verify AWS permissions and quotas"
          echo ""
          echo "📋 Common import commands for this infrastructure type:"
          
          if [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "   # KMS Key:"
            echo "   terraform import aws_kms_key.example 1234abcd-12ab-34cd-56ef-1234567890ab"
            echo "   # KMS Alias:"
            echo "   terraform import aws_kms_alias.example alias/example-alias"
            echo "   # IAM Role:"
            echo "   terraform import aws_iam_role.example role-name"
            echo "   # CloudWatch Log Group:"
            echo "   terraform import aws_cloudwatch_log_group.example log-group-name"
            echo "   # S3 Bucket:"
            echo "   terraform import aws_s3_bucket.example bucket-name"
          elif [ "${{ inputs.infrastructure_type }}" == "base-infra" ]; then
            echo "   # Cognito User Pool:"
            echo "   terraform import aws_cognito_user_pool.example us-east-1_abcdefghi"
            echo "   # Lambda Layer:"
            echo "   terraform import aws_lambda_layer_version.example layer-name:1"
          fi
          
          echo ""
          echo "🎯 Proceeding with deployment..."
      
      - name: Terraform Apply
        if: inputs.destroy != true
        run: |
          echo "🚀 Applying infrastructure changes..."
          
          # Apply with enhanced error handling
          if terraform apply -auto-approve "${{ inputs.environment }}.tfplan"; then
            echo "✅ Terraform apply completed successfully"
            
            # Show final state summary
            RESOURCE_COUNT=$(terraform state list | wc -l)
            echo "📊 Infrastructure now manages $RESOURCE_COUNT resources"
            
            # List outputs if any exist
            if terraform output > /dev/null 2>&1; then
              echo "📋 Available outputs:"
              terraform output
            fi
          else
            echo "❌ Terraform apply failed"
            
            # Show state for debugging
            echo "🔍 Current state resources:"
            terraform state list || echo "No resources in state"
            
            # Check for common issues
            echo "🔧 Checking for common deployment issues..."
            echo "This may be due to:"
            echo "  - Resource conflicts with existing AWS resources"
            echo "  - Permission issues"
            echo "  - Resource dependencies not met"
            echo "  - Quota limits reached"
            
            exit 1
          fi
      
      - name: Terraform Destroy
        if: inputs.destroy == true
        run: |
          # Determine which variable files to use for destroy
          DESTROY_ARGS="-var=environment=${{ inputs.environment }}"
          
          if [ -f "terraform.auto.tfvars" ]; then
            echo "✅ Using terraform.auto.tfvars for destroy"
          elif [ -f "environments/${{ inputs.environment }}.tfvars" ]; then
            echo "✅ Using environment-specific tfvars file for destroy"
            DESTROY_ARGS="$DESTROY_ARGS -var-file=environments/${{ inputs.environment }}.tfvars"
          fi
          
          terraform destroy $DESTROY_ARGS -auto-approve
      
      - name: Generate Deployment Summary
        if: inputs.destroy != true && success()
        run: |
          echo "## 🚀 Deployment Complete - ${{ inputs.infrastructure_type }} (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show state information
          RESOURCE_COUNT=$(terraform state list | wc -l)
          echo "### 📊 Remote State Information:" >> $GITHUB_STEP_SUMMARY
          echo "- **Resources Managed:** $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **State Backend:** S3 Remote State" >> $GITHUB_STEP_SUMMARY
          echo "- **State Key:** ${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Infrastructure-specific outputs
          if [ "${{ inputs.infrastructure_type }}" == "base-infra" ]; then
            echo "### 🏗️ Base Infrastructure Deployed:" >> $GITHUB_STEP_SUMMARY
            
            # Lambda Layer Info
            if terraform output lambda_layer_arn > /dev/null 2>&1; then
              echo "- **Lambda Layer ARN:** $(terraform output -raw lambda_layer_arn)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Cognito User Pool
            if terraform output cognito_user_pool_id > /dev/null 2>&1; then
              echo "- **Cognito User Pool ID:** $(terraform output -raw cognito_user_pool_id)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Database endpoints
            if terraform output database_endpoint > /dev/null 2>&1; then
              echo "- **Database Endpoint:** $(terraform output -raw database_endpoint)" >> $GITHUB_STEP_SUMMARY
            fi
            
          elif [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "### 🖥️ Application Infrastructure Deployed:" >> $GITHUB_STEP_SUMMARY
            
            # Frontend URL
            if terraform output frontend_url > /dev/null 2>&1; then
              echo "- **Frontend URL:** $(terraform output -raw frontend_url)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # API Gateway
            if terraform output api_gateway_url > /dev/null 2>&1; then
              echo "- **API Gateway URL:** $(terraform output -raw api_gateway_url)" >> $GITHUB_STEP_SUMMARY
            fi
            
            # CloudFront
            if terraform output cloudfront_distribution_id > /dev/null 2>&1; then
              echo "- **CloudFront Distribution ID:** $(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Generate Deployment Failure Summary
        if: inputs.destroy != true && failure()
        run: |
          echo "## ❌ Deployment Failed - ${{ inputs.infrastructure_type }} (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### � Failure Analysis:" >> $GITHUB_STEP_SUMMARY
          
          # Show current state
          RESOURCE_COUNT=$(terraform state list | wc -l || echo "0")
          echo "- **Current State Resources:** $RESOURCE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **State Backend:** S3 Remote State" >> $GITHUB_STEP_SUMMARY
          echo "- **State Key:** ${{ inputs.infrastructure_type }}/${{ inputs.environment }}/terraform.tfstate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🛠️ Troubleshooting Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Check AWS Console** for existing resources that may conflict" >> $GITHUB_STEP_SUMMARY
          echo "2. **Review Terraform Plan** for resource naming conflicts" >> $GITHUB_STEP_SUMMARY
          echo "3. **Import Existing Resources** using terraform import commands" >> $GITHUB_STEP_SUMMARY
          echo "4. **Verify AWS Permissions** for the deployment role" >> $GITHUB_STEP_SUMMARY
          echo "5. **Check Resource Quotas** in the target AWS region" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "### 📋 Common Import Commands:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "# For existing KMS resources:" >> $GITHUB_STEP_SUMMARY
            echo "terraform import aws_kms_alias.example alias/your-alias-name" >> $GITHUB_STEP_SUMMARY
            echo "terraform import aws_iam_role.example your-role-name" >> $GITHUB_STEP_SUMMARY
            echo "terraform import aws_cloudwatch_log_group.example /aws/lambda/your-function" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Generate Destroy Summary
        if: inputs.destroy == true
        run: |
          echo "## 🧹 Destroy Complete - ${{ inputs.infrastructure_type }} (${{ inputs.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Infrastructure Destroyed:" >> $GITHUB_STEP_SUMMARY
          echo "- All ${{ inputs.infrastructure_type }} resources have been destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform state has been updated" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.infrastructure_type }}" == "application" ]; then
            echo "- Base infrastructure remains intact" >> $GITHUB_STEP_SUMMARY
          fi
