name: Terraform CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  terraform:
    name: 'Terraform Lint, Security Check, and Deploy'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: 'us-east-1'
      TF_VERSION: '1.4.0'
      TFLINT_VERSION: '0.46.1'  # Updated to a more recent version
      TFSEC_VERSION: '1.28.1'   # Updated to a more recent version

    steps:
    - name: 'Checkout GitHub repository'
      uses: actions/checkout@v2

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Set up Terraform'
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: 'Install TFLint'
      run: |
        curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
        unzip tflint.zip -d /usr/local/bin/
        tflint --version

    - name: 'Install tfsec'
      run: |
        curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
        chmod +x tfsec
        mv tfsec /usr/local/bin/
        tfsec --version

    - name: 'Debug Directory Structure'
      run: |
        echo "Current directory:"
        pwd
        echo "Repository structure:"
        ls -la
        echo "Terraform directory:"
        ls -la terraform/

    - name: 'Clean Terraform Cache'
      run: |
        cd terraform
        rm -rf .terraform
        rm -f .terraform.lock.hcl

    - name: 'Bootstrap Backend Infrastructure (if needed)'
      run: |
        cd terraform/bootstrap
        echo "🚀 Checking if backend infrastructure exists..."
        
        # Try to describe the S3 bucket
        if aws s3api head-bucket --bucket cosine-terraform-state-bucket 2>/dev/null; then
          echo "✅ Backend infrastructure already exists"
        else
          echo "📦 Creating backend infrastructure..."
          terraform init
          terraform plan
          terraform apply -auto-approve
          echo "✅ Backend infrastructure created successfully"
        fi

    - name: 'Terraform Init with Backend'
      run: |
        cd terraform
        # Initialize with environment-specific state file
        echo "🔧 Initializing Terraform with remote backend..."
        
        # Check if we're migrating from local state
        if [ -f terraform.tfstate ]; then
          echo "📦 Local state file found - migrating to remote backend..."
          terraform init -backend-config="key=environments/${{ github.ref_name }}/terraform.tfstate" -migrate-state -force-copy
          # Remove local state file after migration
          rm -f terraform.tfstate terraform.tfstate.backup
        else
          echo "🚀 Initializing with remote backend..."
          terraform init -backend-config="key=environments/${{ github.ref_name }}/terraform.tfstate"
        fi

    - name: 'Terraform Format'
      run: |
        cd terraform
        terraform fmt

    - name: 'Terraform Validate'
      run: |
        cd terraform
        echo "🔍 Validating Terraform configuration..."
        terraform validate
        echo "📋 Backend configuration info:"
        echo "  Branch: ${{ github.ref_name }}"
        echo "  State file: environments/${{ github.ref_name }}/terraform.tfstate"
        echo "  S3 Bucket: cosine-terraform-state-bucket"
        echo "  DynamoDB Table: cosine-terraform-locks"

    - name: 'TFLint'
      run: |
        cd terraform
        tflint --init
        tflint

    - name: 'tfsec'
      run: |
        cd terraform
        tfsec .

    - name: 'Handle Existing Resources'
      run: |
        cd terraform
        echo "🔍 Checking for existing AWS resources..."
        
        # Function to check and import S3 bucket
        check_and_import_bucket() {
          local bucket_name="$1"
          local resource_name="$2"
          
          echo "Checking bucket: $bucket_name"
          if aws s3api head-bucket --bucket "$bucket_name" 2>/dev/null; then
            echo "✅ Bucket $bucket_name exists"
            if ! terraform state show "$resource_name" 2>/dev/null; then
              echo "📦 Importing bucket $bucket_name into Terraform state..."
              terraform import "$resource_name" "$bucket_name"
              
              # Import related bucket resources if they exist
              echo "🔧 Importing related bucket configuration..."
              
              # Try to import bucket ACL (may fail if not set, that's ok)
              terraform import "${resource_name/aws_s3_bucket/aws_s3_bucket_acl}" "$bucket_name" 2>/dev/null || echo "   ⚠️  No custom ACL to import"
              
              # Try to import bucket versioning
              terraform import "${resource_name/aws_s3_bucket/aws_s3_bucket_versioning}" "$bucket_name" 2>/dev/null || echo "   ⚠️  No versioning config to import"
              
              # Try to import bucket encryption
              terraform import "${resource_name/aws_s3_bucket/aws_s3_bucket_server_side_encryption_configuration}" "$bucket_name" 2>/dev/null || echo "   ⚠️  No encryption config to import"
              
              # Try to import bucket public access block
              terraform import "${resource_name/aws_s3_bucket/aws_s3_bucket_public_access_block}" "$bucket_name" 2>/dev/null || echo "   ⚠️  No public access block to import"
              
              # Try to import bucket ownership controls
              terraform import "${resource_name/aws_s3_bucket/aws_s3_bucket_ownership_controls}" "$bucket_name" 2>/dev/null || echo "   ⚠️  No ownership controls to import"
              
              echo "✅ Import completed for $bucket_name"
            else
              echo "✅ Bucket $bucket_name already managed by Terraform"
            fi
          else
            echo "ℹ️  Bucket $bucket_name does not exist - will be created"
          fi
        }
        
        # Get the expected bucket name from variables
        PROJECT_NAME=$(grep 'project_name' terraform.auto.tfvars | cut -d'"' -f2)
        ENVIRONMENT=$(grep 'environment' terraform.auto.tfvars | cut -d'"' -f2)
        
        EXPECTED_BUCKET_NAME="${PROJECT_NAME}-frontend-${ENVIRONMENT}"
        
        echo "📋 Expected bucket name: $EXPECTED_BUCKET_NAME"
        
        # Check and import the main S3 bucket
        check_and_import_bucket "$EXPECTED_BUCKET_NAME" "aws_s3_bucket.frontend[0]"
        
        echo "🎯 Resource check completed!"

    - name: 'Terraform Plan'
      run: |
        cd terraform
        echo "Files in terraform directory:"
        ls -la
        echo "Content of terraform.auto.tfvars:"
        cat terraform.auto.tfvars
        echo "🔍 Current Terraform workspace:"
        terraform workspace show
        echo "📋 Planning infrastructure changes..."
        terraform plan -input=false -out=tfplan

    - name: 'Terraform Apply'
      if: github.ref == 'refs/heads/staging'
      run: |
        cd terraform
        echo "🚀 Applying infrastructure changes..."
        terraform apply -input=false -auto-approve tfplan
        echo "✅ Infrastructure deployment completed!"
        echo "📊 Current state summary:"
        terraform state list