name: Terraform CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  terraform:
    name: 'Terraform Lint, Security Check, and Deploy'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: 'us-east-1'
      TF_VERSION: '1.4.0'
      TFLINT_VERSION: '0.46.1'  # Updated to a more recent version
      TFSEC_VERSION: '1.28.1'   # Updated to a more recent version

    steps:
    - name: 'Checkout GitHub repository'
      uses: actions/checkout@v2

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Set up Terraform'
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: 'Install TFLint'
      run: |
        curl -sLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v${{ env.TFLINT_VERSION }}/tflint_linux_amd64.zip
        unzip tflint.zip -d /usr/local/bin/
        tflint --version

    - name: 'Install tfsec'
      run: |
        curl -sLo tfsec https://github.com/aquasecurity/tfsec/releases/download/v${{ env.TFSEC_VERSION }}/tfsec-linux-amd64
        chmod +x tfsec
        mv tfsec /usr/local/bin/
        tfsec --version

    - name: 'Debug Directory Structure'
      run: |
        echo "Current directory:"
        pwd
        echo "Repository structure:"
        ls -la
        echo "Terraform directory:"
        ls -la terraform/

    - name: 'Clean Terraform Cache'
      run: |
        cd terraform
        rm -rf .terraform
        rm -f .terraform.lock.hcl

    - name: 'Bootstrap Backend Infrastructure (if needed)'
      run: |
        cd terraform/bootstrap
        echo "🚀 Checking if backend infrastructure exists..."
        
        # Try to describe the S3 bucket
        if aws s3api head-bucket --bucket cosine-terraform-state-bucket 2>/dev/null; then
          echo "✅ Backend infrastructure already exists"
        else
          echo "📦 Creating backend infrastructure..."
          terraform init
          terraform plan
          terraform apply -auto-approve
          echo "✅ Backend infrastructure created successfully"
        fi

    - name: 'Terraform Init with Backend'
      run: |
        cd terraform
        # Initialize with environment-specific state file
        echo "🔧 Initializing Terraform with remote backend..."
        
        # Check if we're migrating from local state
        if [ -f terraform.tfstate ]; then
          echo "📦 Local state file found - migrating to remote backend..."
          terraform init -backend-config="key=environments/${{ github.ref_name }}/terraform.tfstate" -migrate-state -force-copy
          # Remove local state file after migration
          rm -f terraform.tfstate terraform.tfstate.backup
        else
          echo "🚀 Initializing with remote backend..."
          terraform init -backend-config="key=environments/${{ github.ref_name }}/terraform.tfstate"
        fi

    - name: 'Terraform Format'
      run: |
        cd terraform
        terraform fmt

    - name: 'Terraform Validate'
      run: |
        cd terraform
        echo "🔍 Validating Terraform configuration..."
        terraform validate
        echo "📋 Backend configuration info:"
        echo "  Branch: ${{ github.ref_name }}"
        echo "  State file: environments/${{ github.ref_name }}/terraform.tfstate"
        echo "  S3 Bucket: cosine-terraform-state-bucket"
        echo "  DynamoDB Table: cosine-terraform-locks"

    - name: 'TFLint'
      run: |
        cd terraform
        tflint --init
        tflint

    - name: 'tfsec'
      run: |
        cd terraform
        tfsec .

    - name: 'Terraform Plan'
      run: |
        cd terraform
        echo "Files in terraform directory:"
        ls -la
        echo "Content of terraform.auto.tfvars:"
        cat terraform.auto.tfvars
        echo "🔍 Current Terraform workspace:"
        terraform workspace show
        echo "📋 Planning infrastructure changes..."
        terraform plan -input=false -out=tfplan

    - name: 'Terraform Apply'
      if: github.ref == 'refs/heads/staging'
      run: |
        cd terraform
        echo "🚀 Applying infrastructure changes..."
        terraform apply -input=false -auto-approve tfplan
        echo "✅ Infrastructure deployment completed!"
        echo "📊 Current state summary:"
        terraform state list