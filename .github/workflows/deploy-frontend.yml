# Frontend Application Deployment Pipeline
# Builds and deploys frontend container to ECS
#
# USAGE:
# - Automatically called by deploy-application.yml (main pipeline)
# - Can be manually triggered for frontend-only deployments
# - No longer runs on push/PR to avoid duplicate executions

name: Deploy Frontend Application

on:
  # Only trigger for workflow_call (when called by other workflows) 
  # and workflow_dispatch (manual trigger)
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: string
      frontend_only:
        description: 'Skip infrastructure checks for faster deployment'
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      frontend_only:
        description: 'Deploy frontend only (skip infrastructure checks)'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cosine-frontend
  ECS_CLUSTER: cosine-cluster
  ECS_SERVICE: cosine-frontend-service

jobs:
  # Determine environment based on branch or input
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      ecr_repository: ${{ steps.env.outputs.ecr_repository }}
      ecs_cluster: ${{ steps.env.outputs.ecs_cluster }}
      ecs_service: ${{ steps.env.outputs.ecs_service }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_call" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENVIRONMENT="production"
          else
            ENVIRONMENT="staging"
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "ecr_repository=${ECR_REPOSITORY}-${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "ecs_cluster=${ECS_CLUSTER}-${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "ecs_service=${ECS_SERVICE}-${ENVIRONMENT}" >> $GITHUB_OUTPUT

  # Build and deploy frontend
  check-infrastructure:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    # Skip infrastructure check if this is a frontend-only deployment
    if: ${{ !(github.event.inputs.frontend_only == 'true' || inputs.frontend_only == true) }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if infrastructure exists
        env:
          ECR_REPOSITORY: ${{ needs.setup.outputs.ecr_repository }}
          ECS_CLUSTER: ${{ needs.setup.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.setup.outputs.ecs_service }}
        run: |
          echo "🔍 Checking if infrastructure is ready..."
          
          # Check ECR repository
          if aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION > /dev/null 2>&1; then
            echo "✅ ECR Repository '$ECR_REPOSITORY' exists"
          else
            echo "❌ ECR Repository '$ECR_REPOSITORY' not found"
            echo "🚨 Please run terraform apply first to create infrastructure"
            exit 1
          fi
          
          # Check ECS cluster
          if aws ecs describe-clusters --clusters $ECS_CLUSTER --region $AWS_REGION --query 'clusters[0].status' --output text | grep -q ACTIVE; then
            echo "✅ ECS Cluster '$ECS_CLUSTER' is active"
          else
            echo "❌ ECS Cluster '$ECS_CLUSTER' not found or not active"
            echo "🚨 Please run terraform apply first to create infrastructure"
            exit 1
          fi
          
          # Check ECS service
          if aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --region $AWS_REGION --query 'services[0].status' --output text | grep -q ACTIVE; then
            echo "✅ ECS Service '$ECS_SERVICE' is active"
          else
            echo "❌ ECS Service '$ECS_SERVICE' not found or not active"
            echo "🚨 Please run terraform apply first to create infrastructure"
            exit 1
          fi
          
          echo "🎉 All infrastructure components are ready!"

  # Build and deploy frontend
  deploy-frontend:
    needs: [setup, check-infrastructure]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    # Always run if check-infrastructure was skipped, otherwise wait for it
    if: ${{ always() && (needs.check-infrastructure.result == 'success' || needs.check-infrastructure.result == 'skipped') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get commit SHA (short)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get authentication config from Terraform outputs
        id: get-auth-config
        run: |
          echo "🔍 Getting authentication configuration from Terraform outputs..."
          
          # Use terraform output from the current workspace's state
          # This reads the computed values from our data sources
          
          cd terraform
          
          # Get authentication configuration from terraform output
          AUTH_CONFIG=$(terraform output -json authentication_config 2>/dev/null || echo "{}")
          
          if [ "$AUTH_CONFIG" = "{}" ] || [ "$AUTH_CONFIG" = "null" ]; then
            echo "❌ Could not retrieve authentication config from Terraform outputs"
            echo "🚨 Please ensure application infrastructure is deployed:"
            echo "   Run: terraform apply in the terraform/ directory"
            echo "   This will discover base infrastructure resources automatically"
            exit 1
          fi
          
          # Parse the JSON output
          COGNITO_USER_POOL_ID=$(echo $AUTH_CONFIG | jq -r '.user_pool_id // empty')
          COGNITO_CLIENT_ID=$(echo $AUTH_CONFIG | jq -r '.client_id // empty')
          COGNITO_FULL_DOMAIN=$(echo $AUTH_CONFIG | jq -r '.full_domain // empty')
          ENVIRONMENT=$(echo $AUTH_CONFIG | jq -r '.environment // "staging"')
          
          cd ..
          
          # Validate all required values
          if [ -z "$COGNITO_USER_POOL_ID" ]; then
            echo "❌ Missing Cognito User Pool ID in terraform outputs"
            echo "🚨 Base infrastructure may not be deployed or accessible"
            exit 1
          fi
          
          if [ -z "$COGNITO_CLIENT_ID" ]; then
            echo "❌ Missing Cognito Client ID in terraform outputs"
            echo "🚨 Base infrastructure may not be deployed or accessible"
            exit 1
          fi
          
          if [ -z "$COGNITO_FULL_DOMAIN" ]; then
            echo "❌ Missing Cognito Domain in terraform outputs"
            echo "🚨 Base infrastructure may not be deployed or accessible"
            exit 1
          fi
          
          # Set outputs for Docker build
          echo "cognito_user_pool_id=${COGNITO_USER_POOL_ID}" >> $GITHUB_OUTPUT
          echo "cognito_client_id=${COGNITO_CLIENT_ID}" >> $GITHUB_OUTPUT
          echo "cognito_domain=${COGNITO_FULL_DOMAIN}" >> $GITHUB_OUTPUT
          
          echo "✅ Authentication config retrieved successfully:"
          echo "  - Environment: ${ENVIRONMENT}"
          echo "  - User Pool ID: ${COGNITO_USER_POOL_ID}"
          echo "  - Client ID: ${COGNITO_CLIENT_ID}"
          echo "  - Domain: ${COGNITO_FULL_DOMAIN}"
          echo "� Source: Terraform outputs with automatic base infrastructure discovery"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ needs.setup.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          # Build Docker image with build args for environment variables
          docker build \
            --build-arg NEXT_PUBLIC_AWS_REGION=us-east-1 \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_ID="${{ steps.get-auth-config.outputs.cognito_user_pool_id }}" \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID="${{ steps.get-auth-config.outputs.cognito_client_id }}" \
            --build-arg NEXT_PUBLIC_COGNITO_DOMAIN="${{ steps.get-auth-config.outputs.cognito_domain }}" \
            --build-arg NEXT_PUBLIC_API_GATEWAY_URL="" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./frontend/app
          
          # Delete existing tags if they exist (ignore failures)
          aws ecr batch-delete-image \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION \
            --image-ids imageTag=$IMAGE_TAG || true
          
          aws ecr batch-delete-image \
            --repository-name $ECR_REPOSITORY \
            --region $AWS_REGION \
            --image-ids imageTag=latest || true
          
          # Push commit-specific tag first
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Push new latest tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Amazon ECS
        env:
          ECS_CLUSTER: ${{ needs.setup.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.setup.outputs.ecs_service }}
        run: |
          # Force new deployment to pull latest image
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment to complete
        env:
          ECS_CLUSTER: ${{ needs.setup.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.setup.outputs.ecs_service }}
        run: |
          echo "Waiting for service to reach stable state..."
          
          # Set timeout for waiting (10 minutes = 600 seconds)
          timeout 600 aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION || {
            echo "⚠️  Service stability wait timed out or failed. Checking current status..."
            
            # Get current service status
            aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --query 'services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount}' \
              --output table \
              --region $AWS_REGION
            
            # Check if we have at least one healthy task running
            RUNNING_COUNT=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --query 'services[0].runningCount' \
              --output text \
              --region $AWS_REGION)
            
            if [ "$RUNNING_COUNT" -gt 0 ]; then
              echo "✅ Deployment partially successful - $RUNNING_COUNT tasks running"
              echo "⚠️  Service may still be stabilizing. Check AWS console for health status."
            else
              echo "❌ No tasks running - deployment failed"
              exit 1
            fi
          }
          
          echo "✅ Deployment completed!"

      - name: Get service status
        env:
          ECS_CLUSTER: ${{ needs.setup.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.setup.outputs.ecs_service }}
        run: |
          echo "📊 Service Status:"
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount}' \
            --output table \
            --region $AWS_REGION

  # Verify deployment
  verify-deployment:
    needs: [setup, deploy-frontend]
    runs-on: ubuntu-latest
    if: always() && needs.deploy-frontend.result == 'success'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB URL
        id: get-url
        env:
          ECS_CLUSTER: ${{ needs.setup.outputs.ecs_cluster }}
          ECS_SERVICE: ${{ needs.setup.outputs.ecs_service }}
        run: |
          echo "🔍 Getting ALB URL from ECS service..."
          
          # Get target group ARN from ECS service
          TARGET_GROUP_ARN=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text \
            --region $AWS_REGION)
          
          echo "Target Group ARN: $TARGET_GROUP_ARN"
          
          if [ "$TARGET_GROUP_ARN" != "None" ] && [ "$TARGET_GROUP_ARN" != "" ] && [ "$TARGET_GROUP_ARN" != "null" ]; then
            # Get load balancer ARN from target group
            LB_ARN=$(aws elbv2 describe-target-groups \
              --target-group-arns $TARGET_GROUP_ARN \
              --query 'TargetGroups[0].LoadBalancerArns[0]' \
              --output text \
              --region $AWS_REGION)
            
            echo "Load Balancer ARN: $LB_ARN"
            
            if [ "$LB_ARN" != "None" ] && [ "$LB_ARN" != "" ] && [ "$LB_ARN" != "null" ]; then
              # Get ALB DNS name directly from ARN
              ALB_URL=$(aws elbv2 describe-load-balancers \
                --load-balancer-arns $LB_ARN \
                --query 'LoadBalancers[0].DNSName' \
                --output text \
                --region $AWS_REGION)
              
              echo "ALB DNS Name: $ALB_URL"
              
              if [ "$ALB_URL" != "None" ] && [ "$ALB_URL" != "" ] && [ "$ALB_URL" != "null" ]; then
                echo "url=http://$ALB_URL" >> $GITHUB_OUTPUT
                echo "🌐 Frontend URL: http://$ALB_URL"
              else
                echo "❌ Could not get ALB DNS name"
              fi
            else
              echo "❌ Could not get load balancer ARN from target group"
            fi
          else
            echo "❌ No target group found for ECS service"
            echo "ℹ️  This might be expected if the service doesn't use a load balancer"
          fi

      - name: Health check
        if: steps.get-url.outputs.url
        run: |
          echo "🔍 Performing health check..."
          URL="${{ steps.get-url.outputs.url }}"
          
          # Wait for service to be ready
          for i in {1..10}; do
            if curl -f -s "$URL" > /dev/null; then
              echo "✅ Frontend is responding at $URL"
              exit 0
            else
              echo "⏳ Attempt $i/10: Waiting for frontend to respond..."
              sleep 30
            fi
          done
          
          echo "❌ Frontend health check failed after 5 minutes"
          exit 1
