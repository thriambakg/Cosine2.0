<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the wave/chart line (brighter for dark backgrounds) -->
    <linearGradient id="waveGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for text (white to light blue) -->
    <linearGradient id="textGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for dark mode -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for the icon with glow -->
  <circle cx="25" cy="30" r="20" fill="url(#waveGradientDark)" opacity="0.15"/>
  
  <!-- Cosine wave with glow effect -->
  <path d="M 5 30 Q 15 15 25 30 T 45 30" 
        stroke="url(#waveGradientDark)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Data points with glow -->
  <circle cx="15" cy="22.5" r="2" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="25" cy="30" r="2" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="35" cy="22.5" r="2" fill="#0ea5e9" filter="url(#glow)"/>
  
  <!-- Company name -->
  <text x="55" y="25" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        fill="url(#textGradientDark)">
    Cosine
  </text>
  
  <!-- Tagline -->
  <text x="55" y="40" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9" 
        font-weight="400" 
        fill="#94a3b8">
    AI Trading Intelligence
  </text>
</svg>
