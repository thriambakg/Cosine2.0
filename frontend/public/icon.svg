<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the wave -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="25" cy="25" r="24" fill="url(#bgGradient)" stroke="url(#iconGradient)" stroke-width="2"/>
  
  <!-- Cosine wave -->
  <path d="M 8 25 Q 16 12 25 25 T 42 25" 
        stroke="url(#iconGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Data points -->
  <circle cx="16" cy="18.5" r="1.5" fill="#2563eb"/>
  <circle cx="25" cy="25" r="1.5" fill="#3b82f6"/>
  <circle cx="34" cy="18.5" r="1.5" fill="#06b6d4"/>
</svg>
