<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the wave/chart line -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Darker blue for "Fin" -->
    <linearGradient id="finGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <!-- Lighter blue for "gov.ai" -->
    <linearGradient id="govGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle for the icon -->
  <circle cx="25" cy="30" r="20" fill="url(#waveGradient)" opacity="0.1"/>
  
  <!-- Cosine wave that resembles stock chart -->
  <path d="M 5 30 Q 15 15 25 30 T 45 30" 
        stroke="url(#waveGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#dropshadow)"/>
  
  <!-- Small data points on the wave to emphasize stock/data aspect -->
  <circle cx="15" cy="22.5" r="2" fill="#2563eb" opacity="0.8"/>
  <circle cx="25" cy="30" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="35" cy="22.5" r="2" fill="#06b6d4" opacity="0.8"/>
  
  <!-- Company name -->
  <text x="55" y="25" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        filter="url(#dropshadow)">
    <tspan fill="url(#finGradient)">Fin</tspan>
    <tspan fill="url(#govGradient)">gov.ai</tspan>
  </text>
  
  <!-- Subtle tagline -->
  <text x="55" y="40" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="9" 
        font-weight="400" 
        fill="#64748b">
    Government Financial Research
  </text>
</svg>
